name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Provides the pnpm version pinned by package.json's packageManager field
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The same package.json scripts the justfile recipes call
      - run: pnpm run test

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: mkdir -p build && pnpm run package

      - uses: actions/upload-artifact@v4
        with:
          name: dats.vsix
          path: build/dats.vsix
